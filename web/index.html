<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RRHH - Marcaciones</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        .form-group { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Registro de Marcaciones</h2>
    <div style="display: flex; gap: 20px;">
        <form id="marcacionForm">
            <div class="form-group"><input type="text" id="codigo" placeholder="Código Empleado EMP001" required></div>
            <div class="form-group"><input type="text" id="nombre" placeholder="Nombre completo" required></div>
            <div class="form-group"><input type="date" id="fecha" required></div>
            <div class="form-group"><label>Ingreso Prog:</label> <input type="time" id="ingreso_prog" value="08:00" required></div>
            <div class="form-group"><label>Ingreso Real:</label> <input type="time" id="ingreso_real"></div>
            <div class="form-group"><label>Salida Prog:</label> <input type="time" id="salida_prog" value="16:00" required></div>
            <div class="form-group"><label>Salida Real:</label> <input type="time" id="salida_real"></div>
            <button type="submit">Registrar</button>
        </form>
        <div>
            <input type="text" id="filtroCodigo" placeholder="Filtrar por Código">
            <button onclick="cargarMarcaciones()">Filtrar</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Código</th><th>Nombre</th><th>Fecha</th><th>Ingreso Prog</th><th>Ingreso Real</th><th>Estado</th><th>Acción</th>
            </tr>
        </thead>
        <tbody id="tablaCuerpo"></tbody>
    </table>
    <script src="app.js"></script>
</body>
</html>
